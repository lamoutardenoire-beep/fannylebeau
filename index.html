        /* Hero Section - Two Columns */
        .hero { background: var(--bg-dark); color: var(--white); padding: 50px 20px 70px; }
        .hero-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 50px; flex-wrap: wrap; }
        
        .hero-image-col { flex: 1; min-width: 280px; text-align: center; }

        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(114, 83, 249, 0.6); }

        /* Sections standard */

        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 50px; color: var(--text-dark); }
        .section-title span { color: var(--primary); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media(max-width: 768px) { 
            .grid-2 { grid-template-columns: 1fr; } 
            .hero-container { flex-direction: column; text-align: center; }
        }
        
        .card { background: var(--bg-light); border: 1px solid #e3d8f5; border-radius: 16px; padding: 30px; }
        .card h3 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }
        .card ul { list-style: none; }
        .card li { margin-bottom: 15px; position: relative; padding-left: 25px; }
        .card li::before { content: "✓"; position: absolute; left: 0; color: var(--primary); font-weight: bold; }

        /* Social Proof / Authority Section */
        .proof-section { background: var(--bg-light); padding: 50px 20px; text-align: center; border-top: 1px solid #e3d8f5; border-bottom: 1px solid #e3d8f5; }
        .proof-content { max-width: 700px; margin: 0 auto; font-size: 1.1rem; font-style: italic; color: var(--text-dark); }
        .proof-author { margin-top: 15px; font-weight: 600; font-style: normal; font-size: 0.95rem; color: var(--primary); }

        .footer { text-align: center; padding: 40px; background: var(--white); font-size: 0.9rem; color: #666; }
    </style>
</head>
